name: CI/CD — Admin

on:
  workflow_dispatch:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:

  # ── Lint, type-check, test ───────────────────────────────────────────────
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --passWithNoTests

  # ── Build image and push to Docker Hub ──────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jmv-admin:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jmv-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  # ── Deploy Admin only — api stays running ────────────────────────────────
  deploy:
    name: Deploy Admin
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull new image
        working-directory: D:\JVM-SERVER
        run: docker compose pull admin

      - name: Restart Admin only
        working-directory: D:\JVM-SERVER
        run: docker compose up -d --no-deps admin

      - name: Verify
        working-directory: D:\JVM-SERVER
        run: |
          Start-Sleep -Seconds 10
          docker compose ps admin
          docker compose logs admin --tail=20
